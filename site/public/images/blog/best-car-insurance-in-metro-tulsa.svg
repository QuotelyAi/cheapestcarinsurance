<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ea580c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#grad3)"/>

  <!-- Sky Background -->
  <rect y="0" width="1024" height="400" fill="#0284c7"/>

  <!-- Storm Clouds -->
  <ellipse cx="200" cy="150" rx="120" ry="80" fill="#64748b" opacity="0.7"/>
  <ellipse cx="280" cy="120" rx="100" ry="70" fill="#475569" opacity="0.8"/>
  <ellipse cx="800" cy="200" rx="140" ry="90" fill="#64748b" opacity="0.7"/>

  <!-- Tulsa Skyline -->
  <g transform="translate(100, 350)">
    <!-- Buildings -->
    <rect x="0" y="80" width="80" height="200" fill="#1f2937"/>
    <rect x="100" y="0" width="100" height="280" fill="#374151"/>
    <rect x="220" y="60" width="80" height="220" fill="#1f2937"/>
    <rect x="320" y="100" width="90" height="180" fill="#374151"/>
    <rect x="430" y="40" width="100" height="240" fill="#1f2937"/>
    <rect x="550" y="80" width="80" height="200" fill="#374151"/>
    <rect x="650" y="50" width="90" height="230" fill="#1f2937"/>
  </g>

  <!-- Highway (I-44) -->
  <rect y="500" width="1024" height="150" fill="#4b5563"/>
  <line x1="0" y1="575" x2="1024" y2="575" stroke="#fbbf24" stroke-width="8" stroke-dasharray="40,40"/>

  <!-- Cars on highway -->
  <g transform="translate(200, 540)">
    <rect x="0" y="0" width="60" height="30" fill="#ef4444" rx="5"/>
    <circle cx="15" cy="30" r="8" fill="#1f2937"/>
    <circle cx="45" cy="30" r="8" fill="#1f2937"/>
  </g>
  <g transform="translate(600, 550)">
    <rect x="0" y="0" width="60" height="30" fill="#3b82f6" rx="5"/>
    <circle cx="15" cy="30" r="8" fill="#1f2937"/>
    <circle cx="45" cy="30" r="8" fill="#1f2937"/>
  </g>

  <!-- Shield (Insurance) -->
  <g transform="translate(750, 250)">
    <path d="M 0 0 L 50 0 L 50 80 Q 25 100 0 80 Z" fill="#10b981" stroke="white" stroke-width="3"/>
    <text x="25" y="50" font-size="48" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial">✓</text>
  </g>

  <!-- Location text -->
  <text x="512" y="800" font-size="52" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial">Tulsa Metro Insurance</text>
</svg>