<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#grad2)"/>

  <!-- Comparison Bars -->
  <g transform="translate(100, 200)">
    <!-- GEICO -->
    <rect x="0" y="0" width="150" height="300" fill="#10b981" rx="10"/>
    <text x="75" y="330" font-size="24" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial">GEICO</text>

    <!-- State Farm -->
    <rect x="200" y="50" width="150" height="250" fill="#06b6d4" rx="10"/>
    <text x="275" y="330" font-size="24" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial">State Farm</text>

    <!-- Progressive -->
    <rect x="400" y="20" width="150" height="280" fill="#f59e0b" rx="10"/>
    <text x="475" y="330" font-size="24" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial">Progressive</text>

    <!-- Allstate -->
    <rect x="600" y="80" width="150" height="220" fill="#ef4444" rx="10"/>
    <text x="675" y="330" font-size="24" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial">Allstate</text>
  </g>

  <!-- Comparison Title -->
  <text x="512" y="650" font-size="56" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial">Insurance Comparison</text>

  <!-- Checkmark -->
  <g transform="translate(700, 750)">
    <circle cx="0" cy="0" r="60" fill="#10b981"/>
    <path d="M -30 0 L -5 25 L 35 -20" stroke="white" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>