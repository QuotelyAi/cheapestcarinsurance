<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#grad1)"/>

  <!-- Piggy Bank -->
  <g transform="translate(300, 300)">
    <ellipse cx="100" cy="120" rx="80" ry="100" fill="#ec4899"/>
    <circle cx="100" cy="60" r="35" fill="#ec4899"/>
    <rect x="35" y="150" width="20" height="60" fill="#ec4899" rx="10"/>
    <rect x="155" y="150" width="20" height="60" fill="#ec4899" rx="10"/>
    <rect x="60" y="190" width="20" height="60" fill="#ec4899" rx="10"/>
    <rect x="140" y="190" width="20" height="60" fill="#ec4899" rx="10"/>
    <circle cx="75" cy="20" r="12" fill="#fbbf24"/>
  </g>

  <!-- Dollar Sign -->
  <text x="600" y="400" font-size="200" font-weight="bold" fill="#fbbf24" font-family="Arial">$</text>

  <!-- Save Badge -->
  <circle cx="550" cy="700" r="90" fill="#10b981"/>
  <text x="550" y="720" font-size="48" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial">SAVE</text>

  <!-- Car Icon -->
  <g transform="translate(150, 700)">
    <rect x="20" y="80" width="160" height="80" rx="20" fill="#f3f4f6"/>
    <rect x="50" y="50" width="100" height="40" rx="10" fill="#f3f4f6"/>
    <circle cx="50" cy="160" r="20" fill="#1f2937"/>
    <circle cx="130" cy="160" r="20" fill="#1f2937"/>
  </g>
</svg>